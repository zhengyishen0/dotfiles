[mgr]
# Column ratios: parent, current, preview
# Default is [1, 4, 3] - adjust as needed
ratio = [0, 2, 4]

# Other options:
# ratio = [0, 1, 1]    # No parent, equal current/preview
# ratio = [1, 2, 5]    # Larger preview
# ratio = [2, 3, 3]    # Larger parent

[opener]
edit = [
	{ run = 'hx "$@"', block = true, desc = "Open with Helix" },
]
