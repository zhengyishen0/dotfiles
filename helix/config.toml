theme = "tokyonight"

[editor]
line-number = "relative"
mouse = true
end-of-line-diagnostics = "hint"
soft-wrap.enable = true

[editor.statusline]
# left = ["mode", "spinner", "file-name"]
# right = ["diagnostics", "selections", "position", "file-encoding", "file-type"]

[editor.inline-diagnostics]
cursor-line = "info"
# other-lines = "error"

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[keys.normal]
# C-s = ":write"
C-r = ":reload"
";" = "command_mode"
"\\" = "collapse_selection"
"q" = ":quit"

[keys.insert]
# C-s = [":write", "normal_mode"]
