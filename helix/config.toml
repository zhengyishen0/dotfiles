theme = "tokyonight"

[editor]
line-number = "relative"
mouse = true
end-of-line-diagnostics = "hint"
soft-wrap.enable = true
bufferline = "multiple"

[editor.inline-diagnostics]
cursor-line = "info"

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[keys.normal]
# backspace = "change_selection"
# ret = "open_below"  
esc = ["collapse_selection", "keep_primary_selection"]
# S-tab = ":buffer-previous"
# tab = ":buffer-next"
"?" = "command_palette"

"{" = "goto_prev_paragraph"
"}" = "goto_next_paragraph"

[keys.normal.space.w]
# x = "wclose"

[keys.normal.space]
