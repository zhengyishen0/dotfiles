# Use built-in star theme + transient prompt
"$schema" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
version = 2
final_space = true

# Import star theme segments
[[blocks]]
type = "prompt"
alignment = "left"

  [[blocks.segments]]
  type = "root"
  style = "plain"
  foreground = "#E06C75"
  template = "root <#ffffff>in</> "

  [[blocks.segments]]
  type = "path"
  style = "plain"
  foreground = "#55B9C4"
  template = "{{ .Path }} "
  [blocks.segments.properties]
    style = "folder"

  [[blocks.segments]]
  type = "git"
  style = "plain"
  foreground = "#C678DD"
  template = "<#ffffff>on</> {{ .HEAD }}{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }} "
  [blocks.segments.properties]
    fetch_status = true

  [[blocks.segments]]
  type = "node"
  style = "plain"
  foreground = "#98C379"
  template = "<#ffffff>via</>  {{ .Full }} "
  [blocks.segments.properties]
    fetch_version = true

  [[blocks.segments]]
  type = "status"
  style = "plain"
  foreground = "#C94A16"
  template = "x "

[[blocks]]
type = "prompt"
alignment = "left"
newline = true

  [[blocks.segments]]
  type = "text"
  style = "plain"
  foreground = "#63F08C"
  template = "➜ "

# Transient prompt - collapse history to just arrow
[transient_prompt]
foreground = "#63F08C"
template = "➜ "
