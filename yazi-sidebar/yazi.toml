[mgr]
# Single column layout for sidebar use
ratio = [0, 1, 0]

[opener]
edit = [
    { run = 'yazi-helix-open "$@"', block = false, desc = "Open in Helix" },
]

[open]
rules = [
    { mime = "text/*", use = "edit" },
    { mime = "application/json", use = "edit" },
    { mime = "application/x-yaml", use = "edit" },
    { mime = "application/toml", use = "edit" },
    { mime = "application/xml", use = "edit" },
    { mime = "application/javascript", use = "edit" },
    { mime = "application/typescript", use = "edit" },
    { name = "*.md", use = "edit" },
    { name = "*.nu", use = "edit" },
    { name = "*.fish", use = "edit" },
    { name = "*.sh", use = "edit" },
    { name = "*.bash", use = "edit" },
    { name = "*.zsh", use = "edit" },
    { name = "*.py", use = "edit" },
    { name = "*.rs", use = "edit" },
    { name = "*.go", use = "edit" },
    { name = "*.js", use = "edit" },
    { name = "*.ts", use = "edit" },
    { name = "*.tsx", use = "edit" },
    { name = "*.jsx", use = "edit" },
    { name = "*.lua", use = "edit" },
    { name = "*.toml", use = "edit" },
    { name = "*.yaml", use = "edit" },
    { name = "*.yml", use = "edit" },
    { name = "*.json", use = "edit" },
    { name = "*.html", use = "edit" },
    { name = "*.css", use = "edit" },
    { name = "*.scss", use = "edit" },
    { name = "*.swift", use = "edit" },
    { name = "*.c", use = "edit" },
    { name = "*.h", use = "edit" },
    { name = "*.cpp", use = "edit" },
    { name = "*.hpp", use = "edit" },
    { name = "*", use = "edit" },
]
