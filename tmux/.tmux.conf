# ==============================================================================
# CORE SETTINGS
# ==============================================================================
set -g prefix C-Space
bind C-Space send-prefix
set -g mouse on

# Performance
set -sg escape-time 0
set -g default-terminal "tmux-256color"
set -ag terminal-features ",*:RGB"

# Unbind defaults we're replacing
unbind C-b      # default prefix
unbind n        # next-window -> new-window
unbind p        # previous-window -> popup
unbind c        # new-window -> replaced by n
unbind x        # kill-pane -> kill-window
unbind '&'      # kill-window -> replaced by x
unbind r        # refresh-client -> rename-window
unbind ','      # rename-window -> replaced by r
unbind '$'      # rename-session -> replaced by R
unbind Space    # next-layout -> zoom
unbind z        # zoom-pane -> replaced by Space

# ==============================================================================
# COPY MODE (emacs + macOS-style)
# ==============================================================================
setw -g mode-keys emacs

# Scroll: enter copy-mode, auto-exit at bottom
bind -n WheelUpPane if-shell -F "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"
bind -n WheelDownPane send-keys -M

# Navigation (move)
bind -T copy-mode M-Left send-keys -X previous-word
bind -T copy-mode M-Right send-keys -X next-word
bind -T copy-mode C-Left send-keys -X start-of-line
bind -T copy-mode C-Right send-keys -X end-of-line

# Scroll with j/k in copy-mode (5 lines at a time)
bind -T copy-mode j send-keys -X -N 5 scroll-down
bind -T copy-mode k send-keys -X -N 5 scroll-up

# Selection with Shift+arrows (auto-start selection)
bind -T copy-mode S-Left if-shell -F "#{selection_present}" "send-keys -X cursor-left" "send-keys -X begin-selection; send-keys -X cursor-left"
bind -T copy-mode S-Right if-shell -F "#{selection_present}" "send-keys -X cursor-right" "send-keys -X begin-selection; send-keys -X cursor-right"
bind -T copy-mode S-Up if-shell -F "#{selection_present}" "send-keys -X cursor-up" "send-keys -X begin-selection; send-keys -X cursor-up"
bind -T copy-mode S-Down if-shell -F "#{selection_present}" "send-keys -X cursor-down" "send-keys -X begin-selection; send-keys -X cursor-down"

# Selection with Shift+Opt+arrows (by word)
bind -T copy-mode M-S-Left if-shell -F "#{selection_present}" "send-keys -X previous-word" "send-keys -X begin-selection; send-keys -X previous-word"
bind -T copy-mode M-S-Right if-shell -F "#{selection_present}" "send-keys -X next-word" "send-keys -X begin-selection; send-keys -X next-word"

# Selection with Shift+Ctrl+arrows (to line start/end)
bind -T copy-mode C-S-Left if-shell -F "#{selection_present}" "send-keys -X start-of-line" "send-keys -X begin-selection; send-keys -X start-of-line"
bind -T copy-mode C-S-Right if-shell -F "#{selection_present}" "send-keys -X end-of-line" "send-keys -X begin-selection; send-keys -X end-of-line"

# Exit copy-mode for navigation/management keys
# Pane focus: Ctrl+hjkl
bind -T copy-mode C-h send-keys -X cancel \; select-pane -L
bind -T copy-mode C-j send-keys -X cancel \; select-pane -D
bind -T copy-mode C-k send-keys -X cancel \; select-pane -U
bind -T copy-mode C-l send-keys -X cancel \; select-pane -R

# Window nav: Opt+h/l
bind -T copy-mode M-h send-keys -X cancel \; previous-window
bind -T copy-mode M-l send-keys -X cancel \; next-window

# Session switch: Ctrl+Opt+j/k and Ctrl+Opt+Up/Down
bind -T copy-mode C-M-j send-keys -X cancel \; switch-client -n
bind -T copy-mode C-M-k send-keys -X cancel \; switch-client -p
bind -T copy-mode C-M-Up send-keys -X cancel \; switch-client -p
bind -T copy-mode C-M-Down send-keys -X cancel \; switch-client -n

# Window nav: Ctrl+Opt+Left/Right
bind -T copy-mode C-M-Left send-keys -X cancel \; previous-window
bind -T copy-mode C-M-Right send-keys -X cancel \; next-window

# Pane resize: Ctrl+Shift+hjkl
bind -T copy-mode C-S-h send-keys -X cancel \; resize-pane -L 5
bind -T copy-mode C-S-j send-keys -X cancel \; resize-pane -D 5
bind -T copy-mode C-S-k send-keys -X cancel \; resize-pane -U 5
bind -T copy-mode C-S-l send-keys -X cancel \; resize-pane -R 5

# Pane resize: Ctrl+Shift+arrows
bind -T copy-mode C-S-Left send-keys -X cancel \; resize-pane -L 5
bind -T copy-mode C-S-Right send-keys -X cancel \; resize-pane -R 5
bind -T copy-mode C-S-Up send-keys -X cancel \; resize-pane -U 5
bind -T copy-mode C-S-Down send-keys -X cancel \; resize-pane -D 5

# Pane swap/move: Ctrl+Shift+Opt+arrows
bind -T copy-mode C-S-M-Left send-keys -X cancel \; swap-pane -U
bind -T copy-mode C-S-M-Right send-keys -X cancel \; swap-pane -D
bind -T copy-mode C-S-M-Up send-keys -X cancel \; join-pane -h -t :-1
bind -T copy-mode C-S-M-Down send-keys -X cancel \; join-pane -h -t :+1

# Window reorder: Opt+Shift+arrows
bind -T copy-mode M-S-Left send-keys -X cancel \; swap-window -t -1 \; select-window -t -1
bind -T copy-mode M-S-Right send-keys -X cancel \; swap-window -t +1 \; select-window -t +1
bind -T copy-mode M-S-Up send-keys -X cancel \; choose-tree -s "move-window -t \"%%\""
bind -T copy-mode M-S-Down send-keys -X cancel \; choose-tree -s "move-window -t \"%%\""

# Window reorder: Ctrl+Opt+Shift+hjkl
bind -T copy-mode C-S-M-h send-keys -X cancel \; swap-window -t -1 \; select-window -t -1
bind -T copy-mode C-S-M-l send-keys -X cancel \; swap-window -t +1 \; select-window -t +1
bind -T copy-mode C-S-M-j send-keys -X cancel \; choose-tree -s "move-window -t \"%%\""
bind -T copy-mode C-S-M-k send-keys -X cancel \; choose-tree -s "move-window -t \"%%\""

# Pane actions: Opt+d/D/w/W
bind -T copy-mode M-d send-keys -X cancel \; split-window -fh -c "#{pane_current_path}"
bind -T copy-mode M-D send-keys -X cancel \; split-window -v -c "#{pane_current_path}"
bind -T copy-mode M-w send-keys -X cancel \; kill-pane
bind -T copy-mode M-W send-keys -X cancel \; kill-window

# Window/session actions: Opt+a/n/N/r/R
bind -T copy-mode M-a send-keys -X cancel \; choose-tree -w
bind -T copy-mode M-n send-keys -X cancel \; new-window
bind -T copy-mode M-N send-keys -X cancel \; command-prompt "new-session -s '%%'"
bind -T copy-mode M-r send-keys -X cancel \; command-prompt -I "#W" "rename-window '%%'"
bind -T copy-mode M-R send-keys -X cancel \; command-prompt -I "#S" "rename-session '%%'"

# Popup: Opt+p
bind -T copy-mode M-p send-keys -X cancel \; if-shell -F '#{==:#{session_name},popup}' 'detach-client' 'display-popup -w 85% -h 75% -E "tmux new-session -A -s popup"'

# Copy & Paste
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode Escape send-keys -X cancel
bind -n MouseDown3Pane paste-buffer

# ==============================================================================
# APPEARANCE
# ==============================================================================
set -g pane-border-status top
set -g pane-border-format " [ ###P #T ] "
set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}%H:%M %d-%b-%y"
set-window-option -g window-status-style 'fg=default,bg=default'
set-window-option -g window-status-current-style 'fg=default,bg=default,reverse'
set-window-option -g window-status-format ' #{window_name} '
set-window-option -g window-status-current-format ' #{window_name} '

# ==============================================================================
# NAVIGATION
# ==============================================================================
# Window: Ctrl+Opt+Left/Right or Opt+h/l
bind -n C-M-Left previous-window
bind -n C-M-Right next-window
bind -n M-h previous-window
bind -n M-l next-window

# Session: Ctrl+Opt+Up/Down or Ctrl+Opt+j/k
bind -n C-M-Up switch-client -p
bind -n C-M-Down switch-client -n
bind -n C-M-j switch-client -n
bind -n C-M-k switch-client -p

# Pane: Ctrl+arrows or Ctrl+hjkl
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# ==============================================================================
# PANE MANAGEMENT (Opt)
# ==============================================================================
# Split: Opt+d/\ (vertical column), Opt+D/- (horizontal stack)
bind -n M-d split-window -fh -c "#{pane_current_path}"
bind -n 'M-\' split-window -fh -c "#{pane_current_path}"
bind -n M-D split-window -v -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"

# Close: Opt+w/W
bind -n M-w kill-pane
bind -n M-W kill-window

# Chooser: Opt+a (windows/sessions tree)
bind -n M-a choose-tree -w

# Resize: Ctrl+Shift+arrows or Ctrl+Shift+hjkl
bind -n C-S-Left resize-pane -L 5
bind -n C-S-Right resize-pane -R 5
bind -n C-S-Up resize-pane -U 5
bind -n C-S-Down resize-pane -D 5
bind -n C-S-h resize-pane -L 5
bind -n C-S-j resize-pane -D 5
bind -n C-S-k resize-pane -U 5
bind -n C-S-l resize-pane -R 5

# Swap pane: Ctrl+Shift+Opt+arrows
bind -n C-S-M-Left swap-pane -U
bind -n C-S-M-Right swap-pane -D

# Move pane to window: Ctrl+Shift+Opt+Up/Down
bind -n C-S-M-Up join-pane -h -t :-1
bind -n C-S-M-Down join-pane -h -t :+1

# Layout
bind Tab next-layout

# Scroll: Opt+Up/Down or Opt+j/k (enter copy-mode and scroll)
bind -n M-Up copy-mode \; send-keys -X -N 5 scroll-up
bind -n M-Down copy-mode \; send-keys -X -N 5 scroll-down
bind -n M-j copy-mode \; send-keys -X -N 5 scroll-down
bind -n M-k copy-mode \; send-keys -X -N 5 scroll-up

# ==============================================================================
# WINDOW/SESSION MANAGEMENT (Opt)
# ==============================================================================
# Rename: Opt+r/R
bind -n M-r command-prompt -I "#W" "rename-window '%%'"
bind -n M-R command-prompt -I "#S" "rename-session '%%'"

# New: Opt+n/N
bind -n M-n new-window
bind -n M-N command-prompt "new-session -s '%%'"

# ==============================================================================
# TERMINAL INPUT
# ==============================================================================
# Word navigation (Option+arrows) - handled by terminal
bind-key -n M-BSpace send-keys C-w

# Multi-line input (Shift+Enter)
bind -n S-Enter send-keys C-v Enter

# Popup terminal: Opt+p toggles (dismiss keeps session alive)
bind -n M-p if-shell -F '#{==:#{session_name},popup}' 'detach-client' 'display-popup -w 85% -h 75% -E "tmux new-session -A -s popup"'

# ==============================================================================
# HOOKS (auto-equalize column widths)
# ==============================================================================
set-hook -g after-split-window 'run-shell -b "~/dotfiles/scripts/tmux-equalize-columns.sh"'
set-hook -g after-kill-pane 'run-shell -b "sleep 0.1 && ~/dotfiles/scripts/tmux-equalize-columns.sh"'

# ==============================================================================
# PLUGINS
# ==============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'

# Reorder window: Opt+Shift+Left/Right or Ctrl+Opt+Shift+h/l
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1
bind -n C-S-M-h swap-window -t -1 \; select-window -t -1
bind -n C-S-M-l swap-window -t +1 \; select-window -t +1

# Move window to session: Opt+Shift+Up/Down or Ctrl+Opt+Shift+j/k
bind -n M-S-Up choose-tree -s "move-window -t \"%%\""
bind -n M-S-Down choose-tree -s "move-window -t \"%%\""
bind -n C-S-M-j choose-tree -s "move-window -t \"%%\""
bind -n C-S-M-k choose-tree -s "move-window -t \"%%\""

# Exit copy-mode when changing focus
set-hook -g pane-focus-out 'if-shell -F "#{pane_in_mode}" "send-keys -X cancel" ""'
