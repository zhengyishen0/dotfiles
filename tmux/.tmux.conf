# ==============================================================================
# CORE SETTINGS
# ==============================================================================
set -g prefix C-Space
bind C-Space send-prefix
set -g mouse on

# Performance
set -sg escape-time 0
set -g repeat-time 300
set -g default-terminal "tmux-256color"
set -ag terminal-features ",*:RGB"
set -s extended-keys on
set -as terminal-features ',*:extkeys'
set -g allow-passthrough on

# Unbind defaults we're replacing
unbind C-b      # default prefix
unbind n        # next-window -> new-window
unbind p        # previous-window -> popup
unbind c        # new-window -> replaced by n
unbind x        # kill-pane -> kill-window
unbind '&'      # kill-window -> replaced by x
unbind r        # refresh-client -> rename-window
unbind ','      # rename-window -> replaced by r
unbind '$'      # rename-session -> replaced by R
unbind Space    # next-layout -> zoom
unbind z        # zoom-pane -> rebind below
bind z resize-pane -Z

# Unbind ghost bindings (tmux-sensible or stale)
unbind -T root M-Left
unbind -T root M-Right
unbind -T root M-S-Left
unbind -T root M-S-Right
unbind -T root C-S-Left
unbind -T root C-S-Right
unbind -T root C-M-S-Left
unbind -T root C-M-S-Right

# ==============================================================================
# COPY MODE (emacs + macOS-style)
# ==============================================================================
setw -g mode-keys emacs

# Scroll: enter copy-mode, auto-exit at bottom
bind -n WheelUpPane if-shell -F "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"
bind -n WheelDownPane send-keys -M
bind -n M-k copy-mode

# Navigation (move)
bind -T copy-mode M-Left send-keys -X previous-word
bind -T copy-mode M-Right send-keys -X next-word
bind -T copy-mode C-Left send-keys -X start-of-line
bind -T copy-mode C-Right send-keys -X end-of-line
bind -T copy-mode Home send-keys -X start-of-line
bind -T copy-mode End send-keys -X end-of-line

# Unbind default copy-mode arrows we don't use
unbind -T copy-mode M-Up
unbind -T copy-mode M-Down
unbind -T copy-mode C-M-Up
unbind -T copy-mode C-M-Down

# Scroll with Opt+j/k (half page)
bind -T copy-mode M-j send-keys -X halfpage-down
bind -T copy-mode M-k send-keys -X halfpage-up

# Letter keys: exit copy-mode and pass through
bind -T copy-mode a send-keys -X cancel \; send-keys a
bind -T copy-mode b send-keys -X cancel \; send-keys b
bind -T copy-mode c send-keys -X cancel \; send-keys c
bind -T copy-mode d send-keys -X cancel \; send-keys d
bind -T copy-mode e send-keys -X cancel \; send-keys e
bind -T copy-mode f send-keys -X cancel \; send-keys f
bind -T copy-mode g send-keys -X cancel \; send-keys g
bind -T copy-mode h send-keys -X cancel \; send-keys h
bind -T copy-mode i send-keys -X cancel \; send-keys i
bind -T copy-mode j send-keys -X cancel \; send-keys j
bind -T copy-mode k send-keys -X cancel \; send-keys k
bind -T copy-mode l send-keys -X cancel \; send-keys l
bind -T copy-mode m send-keys -X cancel \; send-keys m
bind -T copy-mode n send-keys -X cancel \; send-keys n
bind -T copy-mode o send-keys -X cancel \; send-keys o
bind -T copy-mode p send-keys -X cancel \; send-keys p
bind -T copy-mode q send-keys -X cancel \; send-keys q
bind -T copy-mode r send-keys -X cancel \; send-keys r
bind -T copy-mode s send-keys -X cancel \; send-keys s
bind -T copy-mode t send-keys -X cancel \; send-keys t
bind -T copy-mode u send-keys -X cancel \; send-keys u
bind -T copy-mode v send-keys -X cancel \; send-keys v
bind -T copy-mode w send-keys -X cancel \; send-keys w
bind -T copy-mode x send-keys -X cancel \; send-keys x
bind -T copy-mode y send-keys -X cancel \; send-keys y
bind -T copy-mode z send-keys -X cancel \; send-keys z

# Selection with Shift+arrows (auto-start selection)
bind -T copy-mode S-Left if-shell -F "#{selection_present}" "send-keys -X cursor-left" "send-keys -X begin-selection; send-keys -X cursor-left"
bind -T copy-mode S-Right if-shell -F "#{selection_present}" "send-keys -X cursor-right" "send-keys -X begin-selection; send-keys -X cursor-right"
bind -T copy-mode S-Up if-shell -F "#{selection_present}" "send-keys -X cursor-up" "send-keys -X begin-selection; send-keys -X cursor-up"
bind -T copy-mode S-Down if-shell -F "#{selection_present}" "send-keys -X cursor-down" "send-keys -X begin-selection; send-keys -X cursor-down"

# Selection with Shift+Opt+arrows (by word)
bind -T copy-mode M-S-Left if-shell -F "#{selection_present}" "send-keys -X previous-word" "send-keys -X begin-selection; send-keys -X previous-word"
bind -T copy-mode M-S-Right if-shell -F "#{selection_present}" "send-keys -X next-word" "send-keys -X begin-selection; send-keys -X next-word"

# Selection with Shift+Ctrl+arrows (to line start/end)
bind -T copy-mode C-S-Left if-shell -F "#{selection_present}" "send-keys -X start-of-line" "send-keys -X begin-selection; send-keys -X start-of-line"
bind -T copy-mode C-S-Right if-shell -F "#{selection_present}" "send-keys -X end-of-line" "send-keys -X begin-selection; send-keys -X end-of-line"

# Copy & Paste
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"
bind -T copy-mode Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode Escape send-keys -X cancel
bind -n MouseDown3Pane paste-buffer

# Copy-mode exit bindings (navigation/management keys cancel copy-mode first)
bind -T copy-mode M-Tab send-keys -X cancel \; set -g @pending_switch 1 \; switch-client -T opttab \; run-shell -b 'sleep 0.3 && [ "$(tmux show -gv @pending_switch 2>/dev/null)" = "1" ] && { tmux switch-client -p 2>/dev/null || tmux switch-client -t "$(tmux list-sessions -F \"#{session_name}\" | tail -1)"; } ; tmux set -gu @pending_switch'
bind -T copy-mode M-, send-keys -X cancel \; previous-window
bind -T copy-mode M-. send-keys -X cancel \; next-window
bind -T copy-mode M-d send-keys -X cancel \; split-window -fh -c "#{pane_current_path}"
bind -T copy-mode M-D send-keys -X cancel \; split-window -v -c "#{pane_current_path}"
bind -T copy-mode M-w send-keys -X cancel \; kill-pane
bind -T copy-mode M-W send-keys -X cancel \; kill-window
bind -T copy-mode M-t send-keys -X cancel \; new-window
bind -T copy-mode M-r send-keys -X cancel \; command-prompt -I "#W" "rename-window '%%'"
bind -T copy-mode M-R send-keys -X cancel \; command-prompt -I "#S" "rename-session '%%'"
bind -T copy-mode M-Space send-keys -X cancel \; if-shell -F '#{&&:#{@outer_client},#{!=:#{client_tty},#{@outer_client}}}' \
    'set -g @popup_session "#{session_name}" ; detach-client' \
    'set -g @outer_client "#{client_tty}" ; display-popup -w 85% -h 85% -E "trap \"tmux set -gu @outer_client\" EXIT; S=$(tmux show -gv @popup_session 2>/dev/null) && tmux attach -t \"$S\" 2>/dev/null || tmux new-session -A -s popup"'

# ==============================================================================
# APPEARANCE
# ==============================================================================
set -g pane-border-status top
set -g pane-border-format " [ ###P #T ] "
set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}%H:%M %d-%b-%y"
set-window-option -g window-status-style 'fg=default,bg=default'
set-window-option -g window-status-current-style 'fg=default,bg=default,reverse'
set-window-option -g window-status-format ' #{window_name} '
set-window-option -g window-status-current-format ' #{window_name} '

# ==============================================================================
# NAVIGATION
# ==============================================================================
# Session: Opt+Tab (prev session, cycles), Opt+Tab+Tab (session tree)
bind -n M-Tab set -g @pending_switch 1 \; switch-client -T opttab \; run-shell -b 'sleep 0.3 && [ "$(tmux show -gv @pending_switch 2>/dev/null)" = "1" ] && { tmux switch-client -p 2>/dev/null || tmux switch-client -t "$(tmux list-sessions -F \"#{session_name}\" | tail -1)"; } ; tmux set -gu @pending_switch'
bind -T opttab Tab set -g @pending_switch 0 \; choose-tree -s

# Window nav: Opt+,/.
bind -n M-, previous-window
bind -n M-. next-window

# Window reorder: Opt+</>
bind -n M-< swap-window -t -1 \; select-window -t -1
bind -n M-> swap-window -t +1 \; select-window -t +1

# ==============================================================================
# PANE MANAGEMENT
# ==============================================================================
# Split: Ctrl+\ (vertical), Opt+d/\ (vertical), Opt+D/- (horizontal)
bind -n 'C-\' split-window -fh -c "#{pane_current_path}"
bind -n M-d split-window -fh -c "#{pane_current_path}"
bind -n 'M-\' split-window -fh -c "#{pane_current_path}"
bind -n M-D split-window -v -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"

# Close: Opt+w (pane), Opt+W (window)
bind -n M-w kill-pane
bind -n M-W kill-window

# Swap pane within window: Opt+[/]
bind -n M-[ swap-pane -U
bind -n M-] swap-pane -D

# Move pane to prev/next window: Opt+{/}
bind -n M-'{' join-pane -t :-1
bind -n M-'}' join-pane -t :+1

# ==============================================================================
# WINDOW/SESSION MANAGEMENT
# ==============================================================================
# Rename: Opt+r (window), Opt+R (session)
bind -n M-r command-prompt -I "#W" "rename-window '%%'"
bind -n M-R command-prompt -I "#S" "rename-session '%%'"

# New: Opt+t (window), Opt+n (session)
bind -n M-t new-window
bind -n M-n command-prompt "new-session -s '%%'"

# ==============================================================================
# TERMINAL INPUT
# ==============================================================================
# Opt+Backspace: delete word (send Ctrl+w)
bind-key -n M-BSpace send-keys C-w

# ==============================================================================
# POPUP TERMINAL
# ==============================================================================
# Opt+Space toggles popup (session persists across toggles)
# Uses @outer_client to detect if inside popup; @popup_session remembers last session
bind -n M-Space if-shell -F '#{&&:#{@outer_client},#{!=:#{client_tty},#{@outer_client}}}' \
    'set -g @popup_session "#{session_name}" ; detach-client' \
    'set -g @outer_client "#{client_tty}" ; display-popup -w 85% -h 85% -E "trap \"tmux set -gu @outer_client\" EXIT; S=$(tmux show -gv @popup_session 2>/dev/null) && tmux attach -t \"$S\" 2>/dev/null || tmux new-session -A -s popup"'

# ==============================================================================
# HOOKS
# ==============================================================================
# Auto-equalize column widths after split/close
set-hook -g after-split-window 'run-shell -b "~/dotfiles/scripts/tmux-equalize-columns.sh"'
set-hook -g after-kill-pane 'run-shell -b "sleep 0.1 && ~/dotfiles/scripts/tmux-equalize-columns.sh"'

# Exit copy-mode when changing focus
set-hook -g pane-focus-out 'if-shell -F "#{pane_in_mode}" "send-keys -X cancel" ""'

# Clean stale @outer_client when client disconnects or reconnects
set-hook -g client-detached 'run-shell -b "OC=$(tmux show -gv @outer_client 2>/dev/null) && [ -n \"$OC\" ] && ! tmux list-clients -F \"#{client_tty}\" | grep -qxF \"$OC\" && tmux set -gu @outer_client || true"'
set-hook -g client-attached 'run-shell -b "OC=$(tmux show -gv @outer_client 2>/dev/null) && [ -n \"$OC\" ] && ! tmux list-clients -F \"#{client_tty}\" | grep -qxF \"$OC\" && tmux set -gu @outer_client || true"'

# ==============================================================================
# PLUGINS
# ==============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Seamless Ctrl+hjkl navigation across tmux panes and neovim splits
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'

# Disable aggressive-resize for iTerm2 tmux integration
set -g aggressive-resize off

# ==============================================================================
# MANUAL COMMANDS (reference)
# ==============================================================================
# Popup state (reset if stuck):
#   tmux set -gu @outer_client     # clear outer client tracking
#   tmux set -gu @popup_session    # clear saved popup session
